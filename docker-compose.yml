version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-verification-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PORT=8080
      - DATA_FILE=/app/data/store.json
    volumes:
      - ./data:/app/data
