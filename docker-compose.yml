services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-verification-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - ${GATEWAY_ENV_FILE:-.env}
    volumes:
      - ${GATEWAY_DATA_DIR:-./data}/resources:/app/data
      - ${GATEWAY_DATA_DIR:-./data}/logs:/app/logs
    networks:
      - proxy-net
      - db-net

networks:
  proxy-net:
    external: true
  db-net:
    external: true
