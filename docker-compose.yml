services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-verification-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - ${GATEWAY_ENV_FILE:-.env}
    volumes:
      - ${GATEWAY_DATA_DIR:-./data}:/app/data
    networks:
      - proxy-net

networks:
  proxy-net:
    external: true
